<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selamat Datang di Neostatic</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #090d16 0%, #1e1b4b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      padding: 40px;
      border-radius: 24px;
      max-width: 500px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 12px;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 8px 16px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      font-weight: 600;
      font-size: 0.9rem;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    button {
      margin-top: 24px;
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      background: #0ea5e9;
      color: #04111d;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }
    button:hover {
      background: #38bdf8;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Berhasil Dideploy!</h1>
    <p>Halaman statis HTML ini berhasil diverifikasi oleh <strong>Neostatic Engine</strong> dan disajikan secara aman.</p>
    <div class="badge">🛡️ Zero-Trust Verification Passed</div>
    <div>
      <button onclick="alert('Halo dari file statis JavaScript!')">Klik Demo JS</button>
    </div>
  </div>
</body>
</html>
