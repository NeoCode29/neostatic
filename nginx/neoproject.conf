# /etc/nginx/sites-available/neoproject.my.id
# Konfigurasi Nginx untuk Static Page Hosting & Neostatic Dashboard

server {
    listen 80;
    server_name neoproject.my.id;

    # Redirect seluruh HTTP ke HTTPS jika SSL aktif
    # return 301 https://$host$request_uri;

    # 1. Penyajian File Statis Halaman (/staticpage/<slug>/)
    location /staticpage/ {
        root /var/www;
        index index.html;
        autoindex off;

        # Tolak keras file skrip eksekusi dan file sensitif
        location ~* \.(php|phtml|sh|py|cgi|env|git|htaccess|htpasswd)$ {
            deny all;
            return 404;
        }

        # Header keamanan
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        try_files $uri $uri/ =404;
    }

    # 2. Reverse Proxy ke Neostatic Single-Binary Dashboard & API
    location /deploy-manager/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Izinkan ukuran upload ZIP hingga 100MB
        client_max_body_size 100M;
    }
}

