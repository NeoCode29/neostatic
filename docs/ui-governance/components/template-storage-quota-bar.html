<!-- name: Storage Quota Allocation Bar -->
<!-- category: STATS -->
<!-- description: Disk storage allocation between active staticpage symlinks and release archives -->

<div class="bg-[#1b1f2b] border border-white/5 rounded-2xl p-6 flex flex-col justify-between max-w-sm text-slate-100 font-sans shadow-xl">
  <div class="flex items-center justify-between">
    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Storage Allocation</span>
    <span class="text-[11px] font-mono text-cyan-400 bg-cyan-500/10 px-2 py-0.5 rounded-md border border-cyan-500/20">132 MB Used</span>
  </div>

  <div class="my-3 space-y-4">
    <!-- Badges Breakdown -->
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2">
        <span class="text-xs font-bold px-2 py-0.5 rounded-md bg-white text-slate-900 font-mono">34 MB</span>
        <span class="text-xs text-slate-400">Staticpage</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs font-bold px-2 py-0.5 rounded-md bg-[#00d18f] text-slate-950 font-mono">98 MB</span>
        <span class="text-xs text-slate-400">Releases</span>
      </div>
    </div>

    <!-- Segmented Progress Bar -->
    <div class="w-full">
      <div class="w-full h-3 rounded-full bg-slate-800 overflow-hidden flex">
        <div class="h-full bg-white" style="width: 25%"></div>
        <div class="h-full bg-[#00d18f]" style="width: 50%"></div>
      </div>
      <div class="flex justify-between mt-1.5 text-[10px] text-slate-500 font-mono">
        <span>Quota Cap: 150 MB / site</span>
        <span>132 MB / 500 MB</span>
      </div>
    </div>
  </div>
</div>
