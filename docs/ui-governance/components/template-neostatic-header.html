<!-- name: Neostatic Header & Engine Bar -->
<!-- category: NAVIGATION -->
<!-- description: Top navigation header with brand shield, public domain pill, and live engine status -->

<header class="flex flex-col sm:flex-row sm:items-center justify-between pb-6 border-b border-white/5 mb-8 gap-4 font-sans text-slate-200">
  <div class="flex items-center gap-3.5">
    <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-[#00d18f] to-emerald-400 flex items-center justify-center shadow-lg shadow-[#00d18f]/20">
      <svg class="w-6 h-6 text-slate-950" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <div>
      <div class="flex items-center gap-2">
        <h1 class="text-xl font-extrabold tracking-tight text-white">NEOSTATIC</h1>
        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-[#00d18f]/10 text-[#00d18f] border border-[#00d18f]/20 font-mono">
          v0.1.0
        </span>
      </div>
      <p class="text-xs text-slate-400 font-mono mt-0.5">
        Public Route: <span class="text-white">neoproject.my.id/staticpage/</span><span class="text-[#00d18f]">&lt;slug&gt;</span>/
      </p>
    </div>
  </div>

  <div class="flex items-center gap-3">
    <!-- Live Engine Status Pill -->
    <div class="flex items-center gap-2.5 px-3.5 py-2 rounded-xl bg-[#1b1f2b] border border-white/5 text-xs font-mono shadow-sm">
      <span class="w-2.5 h-2.5 rounded-full bg-[#00d18f] animate-pulse"></span>
      <span class="text-slate-300">Rust Axum • Port 8080</span>
      <span class="text-slate-600">|</span>
      <span class="text-emerald-400 font-bold">18.4 MB RAM</span>
    </div>

    <!-- Admin Token Button -->
    <button class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-[#1b1f2b] hover:bg-slate-800 text-xs text-slate-300 hover:text-white transition border border-white/5 font-medium shadow-sm">
      <svg class="w-3.5 h-3.5 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 2l-2 2m-1.5 1.5L12 11l-4-4-5 5 1.5 1.5L6 12l2 2-2 2 1.5 1.5L9 16l2 2 5.5-5.5 1.5 1.5 2-2-1.5-1.5L21 2z"/>
      </svg>
      <span>Admin Token</span>
    </button>
  </div>
</header>
