<!-- name: Deployed Sites Stat Card -->
<!-- category: STATS -->
<!-- description: Neostatic total active deployed pages metric card with weekly growth and quick deploy action -->

<div class="bg-[#1b1f2b] border border-white/5 rounded-2xl p-6 flex flex-col justify-between max-w-sm text-slate-100 font-sans shadow-xl">
  <div class="flex items-center justify-between">
    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Active Sites</span>
    <span class="w-2.5 h-2.5 rounded-full bg-[#00d18f] animate-pulse"></span>
  </div>
  <div class="my-4">
    <div class="flex items-baseline gap-2">
      <h3 class="text-3xl font-extrabold text-white tracking-tight">14</h3>
      <span class="text-sm font-semibold text-slate-400">sites</span>
      <span class="ml-2 text-xs font-bold px-2 py-0.5 rounded-full bg-[#00d18f]/10 text-[#00d18f] border border-[#00d18f]/20 font-mono">
        +3 this week
      </span>
    </div>
    <p class="text-[11px] text-slate-400 mt-1 font-mono">https://neoproject.my.id/staticpage/*</p>
  </div>
  <button class="w-full py-2.5 px-4 rounded-xl bg-white text-slate-900 font-bold text-xs flex items-center justify-between hover:bg-slate-100 transition shadow-lg active:scale-[0.99]">
    <span>Deploy New Site</span>
    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <line x1="7" y1="17" x2="17" y2="7"></line>
      <polyline points="7 7 17 7 17 17"></polyline>
    </svg>
  </button>
</div>
